# Publica o site no GitHub Pages a cada push na branch main.
# Configuração (uma vez), no GitHub:
#   Settings > Pages > Source: "GitHub Actions"
#   Settings > Secrets and variables > Actions > aba Variables:
#     VITE_SUPABASE_URL       (ex.: https://xxxx.supabase.co)
#     VITE_SUPABASE_ANON_KEY  (chave anon/publishable — é pública, pode ficar em variável)
#     VITE_WHATSAPP_LOJA      (opcional, só dígitos com DDI: 5551999999999)
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir variáveis
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL }}" ] || [ -z "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Cadastre VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_LOJA: ${{ vars.VITE_WHATSAPP_LOJA }}
          VITE_LOGIN_DOMAIN: ${{ vars.VITE_LOGIN_DOMAIN || 'clientes.sacolaodachacara.app' }}
      # Rotas como /admin/pedidos funcionam ao recarregar a página
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
